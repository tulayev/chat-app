<section class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-10">
    <div class="flex flex-col items-center w-full">
        <a routerLink="/login" class="flex items-center gap-2 mb-6 text-xl font-bold text-gray-900">
            <span class="flex items-center justify-center w-9 h-9 rounded-xl bg-primary-600 text-white shadow-soft">
                <svg lucideMessageCircle class="w-5 h-5"></svg>
            </span>
            Chat App
        </a>

        <div class="auth-card">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900 mb-1">
                Welcome back
            </h1>
            <p class="text-sm text-gray-500 mb-6">
                Sign in to continue to your conversations
            </p>

            <form class="space-y-5" [formGroup]="form" (ngSubmit)="onSubmit()">
                <div>
                    <app-text-field
                        label="Username or Email"
                        id="usernameOrEmail"
                        formControlName="usernameOrEmail"
                        autocomplete="username"
                        placeholder="you@example.com"
                    >
                        <svg lucideUser icon class="w-4 h-4"></svg>
                    </app-text-field>
                </div>
                <div>
                    <app-text-field
                        label="Password"
                        id="password"
                        type="password"
                        formControlName="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                    >
                        <svg lucideLock icon class="w-4 h-4"></svg>
                    </app-text-field>
                </div>

                <button type="submit" class="btn-primary w-full">
                    Login
                </button>

                <p class="text-sm text-center text-gray-500">
                    Don't have an account?
                    <a
                        routerLink="/register"
                        class="font-medium text-primary-600 hover:text-primary-700 hover:underline transition-colors duration-200"
                    >
                        Register
                    </a>
                </p>
            </form>
        </div>
    </div>
</section>
