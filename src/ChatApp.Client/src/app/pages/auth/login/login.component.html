<section class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-10">
    <div class="flex flex-col items-center w-full">
        <a routerLink="/login" class="flex items-center gap-2 mb-6 text-xl font-bold text-gray-900">
            <span class="flex items-center justify-center w-9 h-9 rounded-xl bg-primary-600 text-white shadow-soft">
                <svg lucideMessageCircle class="w-5 h-5"></svg>
            </span>
            Chat App
        </a>

        <div class="auth-card">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900 mb-1">
                Welcome back
            </h1>
            <p class="text-sm text-gray-500 mb-6">
                Sign in to continue to your conversations
            </p>

            <form class="space-y-5" [formGroup]="form" (ngSubmit)="onSubmit()">
                <div>
                    <label for="usernameOrEmail" class="form-label">
                        Username or Email
                    </label>
                    <div class="relative">
                        <svg lucideUser class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></svg>
                        <input
                            type="text"
                            formControlName="usernameOrEmail"
                            id="usernameOrEmail"
                            autocomplete="username"
                            class="input-field input-field--icon"
                            placeholder="you@example.com"
                        />
                    </div>
                </div>
                <div>
                    <label for="password" class="form-label">
                        Password
                    </label>
                    <div class="relative">
                        <svg lucideLock class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></svg>
                        <input
                            [type]="showPassword() ? 'text' : 'password'"
                            formControlName="password"
                            id="password"
                            autocomplete="current-password"
                            placeholder="••••••••"
                            class="input-field input-field--icon pr-10"
                        />
                        <button
                            type="button"
                            (click)="showPassword.set(!showPassword())"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors duration-200"
                        >
                            @if (showPassword()) {
                                <svg lucideEyeOff class="w-4 h-4"></svg>
                            } @else {
                                <svg lucideEye class="w-4 h-4"></svg>
                            }
                        </button>
                    </div>
                </div>

                @if (error) {
                    <div class="alert-error">
                        <svg lucideCircleAlert class="w-4 h-4 mt-0.5 shrink-0"></svg>
                        <span>{{ error }}</span>
                    </div>
                }

                <button type="submit" class="btn-primary w-full">
                    Login
                </button>

                <p class="text-sm text-center text-gray-500">
                    Don't have an account?
                    <a
                        routerLink="/register"
                        class="font-medium text-primary-600 hover:text-primary-700 hover:underline transition-colors duration-200"
                    >
                        Register
                    </a>
                </p>
            </form>
        </div>
    </div>
</section>
