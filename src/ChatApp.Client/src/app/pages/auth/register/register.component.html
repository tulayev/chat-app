<section class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-10">
    <div class="flex flex-col items-center w-full">
        <a routerLink="/login" class="flex items-center gap-2 mb-6 text-xl font-bold text-gray-900">
            <span class="flex items-center justify-center w-9 h-9 rounded-xl bg-primary-600 text-white shadow-soft">
                <svg lucideMessageCircle class="w-5 h-5"></svg>
            </span>
            Chat App
        </a>

        <div class="auth-card">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900 mb-1">
                Create your account
            </h1>
            <p class="text-sm text-gray-500 mb-6">
                Join and start chatting in seconds
            </p>

            <form class="space-y-5" [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="flex justify-center">
                    <label for="avatar" class="relative cursor-pointer group">
                        <div class="w-20 h-20 rounded-full bg-gray-100 border border-gray-200 overflow-hidden flex items-center justify-center shadow-sm transition-shadow duration-200 group-hover:shadow-soft">
                            @if (avatarPreviewUrl()) {
                                <img [src]="avatarPreviewUrl()" alt="Avatar preview" class="w-full h-full object-cover" />
                            } @else {
                                <svg lucideCamera class="w-6 h-6 text-gray-400"></svg>
                            }
                        </div>
                        <span class="absolute bottom-0 right-0 flex items-center justify-center w-7 h-7 rounded-full bg-primary-600 text-white shadow-soft ring-2 ring-white transition-colors duration-200 group-hover:bg-primary-700">
                            <svg lucideCamera class="w-3.5 h-3.5"></svg>
                        </span>
                        <input
                            type="file"
                            formControlName="avatar"
                            id="avatar"
                            (change)="onFileSelected($event)"
                            accept="image/*"
                            class="sr-only"
                        />
                    </label>
                </div>

                <div>
                    <label for="username" class="form-label">
                        Username
                    </label>
                    <div class="relative">
                        <svg lucideUser class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></svg>
                        <input
                            type="text"
                            formControlName="username"
                            id="username"
                            autocomplete="username"
                            class="input-field input-field--icon"
                            placeholder="janedoe"
                        />
                    </div>
                </div>
                <div>
                    <label for="email" class="form-label">
                        Email
                    </label>
                    <div class="relative">
                        <svg lucideMail class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></svg>
                        <input
                            type="email"
                            formControlName="email"
                            id="email"
                            autocomplete="email"
                            class="input-field input-field--icon"
                            placeholder="name@company.com"
                        />
                    </div>
                </div>
                <div>
                    <label for="password" class="form-label">
                        Password
                    </label>
                    <div class="relative">
                        <svg lucideLock class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></svg>
                        <input
                            [type]="showPassword() ? 'text' : 'password'"
                            formControlName="password"
                            id="password"
                            autocomplete="new-password"
                            placeholder="••••••••"
                            class="input-field input-field--icon pr-10"
                        />
                        <button
                            type="button"
                            (click)="showPassword.set(!showPassword())"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors duration-200"
                        >
                            @if (showPassword()) {
                                <svg lucideEyeOff class="w-4 h-4"></svg>
                            } @else {
                                <svg lucideEye class="w-4 h-4"></svg>
                            }
                        </button>
                    </div>
                </div>

                @if (error) {
                    <div class="alert-error">
                        <svg lucideCircleAlert class="w-4 h-4 mt-0.5 shrink-0"></svg>
                        <span>{{ error }}</span>
                    </div>
                }

                <button type="submit" class="btn-primary w-full">
                    Create an account
                </button>

                <p class="text-sm text-center text-gray-500">
                    Already have an account?
                    <a
                        routerLink="/login"
                        class="font-medium text-primary-600 hover:text-primary-700 hover:underline transition-colors duration-200"
                    >
                        Login
                    </a>
                </p>
            </form>
        </div>
    </div>
</section>
