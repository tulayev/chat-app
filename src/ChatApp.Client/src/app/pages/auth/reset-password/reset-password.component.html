<section class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-10">
    <div class="auth-card text-center">
        <h1 class="text-2xl font-bold tracking-tight text-gray-900 mb-1">
            Reset your password
        </h1>
        <p class="text-sm text-gray-500 mb-6">
            Enter the code we sent you and choose a new password
        </p>

        <form class="space-y-4 text-left" [formGroup]="form" (ngSubmit)="onSubmit()">
            <div>
                <app-text-field
                    label="Verification code"
                    id="code"
                    formControlName="code"
                    placeholder="code"
                    [icon]="false"
                    inputClass="tracking-widest text-center text-lg font-mono"
                />
            </div>
            <div>
                <app-text-field
                    label="New password"
                    id="newPassword"
                    type="password"
                    formControlName="newPassword"
                    autocomplete="new-password"
                    placeholder="••••••••"
                >
                    <svg lucideLock icon class="w-4 h-4"></svg>
                </app-text-field>
            </div>
            <div>
                <app-text-field
                    label="Confirm new password"
                    id="confirmPassword"
                    type="password"
                    formControlName="confirmPassword"
                    autocomplete="new-password"
                    placeholder="••••••••"
                >
                    <svg lucideLock icon class="w-4 h-4"></svg>
                </app-text-field>
            </div>

            <button type="submit" class="btn-primary w-full">
                Reset password
            </button>

            <p class="text-sm text-center text-gray-500">
                Did not receive a code?
                <a
                    routerLink="/forgot-password"
                    class="font-medium text-primary-600 hover:text-primary-700 hover:underline transition-colors duration-200"
                >
                    Send again
                </a>
            </p>
        </form>

        @if (message) {
            <div [class]="messageType() === 'error' ? 'alert-error' : 'alert-success'" class="mt-6 text-left">
                @if (messageType() === 'error') {
                    <svg lucideCircleAlert class="w-4 h-4 mt-0.5 shrink-0"></svg>
                } @else {
                    <svg lucideCircleCheck class="w-4 h-4 mt-0.5 shrink-0"></svg>
                }
                <span>{{ message }}</span>
            </div>
        }
    </div>
</section>
